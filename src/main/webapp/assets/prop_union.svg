<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="skyU" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="brick" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#skyU)"/>
  
  <!-- Corner Building (Union Street) -->
  <polygon points="120,400 120,120 320,80 500,110 500,400" fill="#334155"/>
  <polygon points="320,80 320,400 500,400 500,110" fill="#1e293b"/>
  
  <!-- Upper Windows -->
  <g fill="#94a3b8">
    <rect x="150" y="150" width="55" height="50" rx="3"/>
    <rect x="230" y="150" width="55" height="50" rx="3"/>
    <rect x="350" y="150" width="60" height="50" rx="3"/>
    <rect x="430" y="150" width="50" height="50" rx="3"/>
    
    <rect x="150" y="230" width="55" height="50" rx="3"/>
    <rect x="230" y="230" width="55" height="50" rx="3"/>
    <rect x="350" y="230" width="60" height="50" rx="3"/>
    <rect x="430" y="230" width="50" height="50" rx="3"/>
  </g>
  
  <!-- 1F Corner Storefront (Restaurant with hood & counter) -->
  <rect x="120" y="300" width="380" height="100" fill="#f8fafc" stroke="#0f172a" stroke-width="3"/>
  
  <!-- Wooden Facade & Entrance -->
  <rect x="130" y="310" width="180" height="85" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/>
  <rect x="330" y="310" width="160" height="85" fill="#bae6fd" stroke="#0284c7" stroke-width="2"/>
  
  <text x="220" y="355" font-family="sans-serif" font-size="12" font-weight="800" fill="#854d0e" text-anchor="middle">元・和食居酒屋居抜き</text>
  <text x="220" y="375" font-family="sans-serif" font-size="9" font-weight="700" fill="#a16207" text-anchor="middle">グリストラップ・排気ダクト完備</text>
  
  <text x="410" y="355" font-family="sans-serif" font-size="12" font-weight="800" fill="#0369a1" text-anchor="middle">ラーメン・食堂相談</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="skyJ" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#skyJ)"/>
  
  <!-- High-Rise Commercial Building (JR Utsunomiya Odori) -->
  <rect x="120" y="30" width="360" height="370" fill="#334155" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Modern Grid Glass Windows -->
  <g fill="#94a3b8" opacity="0.8">
    <rect x="145" y="60" width="60" height="40" rx="2"/>
    <rect x="225" y="60" width="60" height="40" rx="2"/>
    <rect x="305" y="60" width="60" height="40" rx="2"/>
    <rect x="385" y="60" width="60" height="40" rx="2"/>
    
    <rect x="145" y="115" width="60" height="40" rx="2"/>
    <rect x="225" y="115" width="60" height="40" rx="2"/>
    <rect x="305" y="115" width="60" height="40" rx="2"/>
    <rect x="385" y="115" width="60" height="40" rx="2"/>
    
    <rect x="145" y="170" width="60" height="40" rx="2"/>
    <rect x="225" y="170" width="60" height="40" rx="2"/>
    <rect x="305" y="170" width="60" height="40" rx="2"/>
    <rect x="385" y="170" width="60" height="40" rx="2"/>
  </g>
  
  <!-- 1F Main Street Grand Retail Space (37.8 Tsubo) -->
  <rect x="100" y="240" width="400" height="160" fill="#ffffff" stroke="#0f172a" stroke-width="3"/>
  <rect x="120" y="260" width="360" height="120" fill="#bae6fd" stroke="#0284c7" stroke-width="2"/>
  
  <text x="300" y="305" font-family="sans-serif" font-size="14" font-weight="900" fill="#0369a1" text-anchor="middle">JR宇都宮駅西口大通り 1F大型区画 (125㎡)</text>
  <text x="300" y="330" font-family="sans-serif" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">スクール・コワーキング・クリニック・生鮮スーパー需要集中</text>
  <text x="300" y="355" font-family="sans-serif" font-size="10" font-weight="700" fill="#15803d" text-anchor="middle">【投票受付中】最多需要: 学習塾・スクール (34.0pt)</text>
</svg>
